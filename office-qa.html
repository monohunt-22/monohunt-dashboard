<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONOHUNT｜表示検査</title>
<style>body{margin:0;padding:20px;background:#dfe7f4;color:#17294a;font:14px system-ui}h1{font-size:20px}p{line-height:1.7}nav,.targets{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}button,select{min-height:44px;padding:10px 15px;background:white;border:1px solid #abc;border-radius:8px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#2479ef;color:white}:focus-visible{outline:3px solid #1763cf;outline-offset:3px}iframe{border:0;background:white;display:block;height:2400px;max-width:none;box-shadow:0 4px 30px #1233}#holder{overflow:auto;max-width:100%}output{align-self:center}</style></head>
<body><h1>MONOHUNT AI編集室｜表示検査</h1><p>公開版と単体HTMLを同じCSS幅で検査できます。スマホ実機の検査とは区別してください。デスクトップ幅は横スクロールできます。</p>
<div class="targets"><label>検査対象 <select id="target"><option value="office.html?v=20261018-progress1">公開版</option><option value="office-standalone.html">単体HTML</option></select></label><output id="status" aria-live="polite">公開版・390px</output></div>
<nav aria-label="表示幅"><button data-width="390" aria-pressed="true">スマホ 390px</button><button data-width="360" aria-pressed="false">スマホ 360px</button><button data-width="768" aria-pressed="false">タブレット 768px</button><button data-width="1536" aria-pressed="false">PC 1536px</button><a href="office.html">編集室を開く</a></nav>
<div id="holder"><iframe id="preview" title="編集室の幅別プレビュー" src="office.html?v=20261018-progress1" width="390"></iframe></div>
<script>const preview=document.getElementById('preview'),target=document.getElementById('target');function status(){document.getElementById('status').textContent=target.selectedOptions[0].textContent+'・'+preview.width+'px'}document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{preview.width=b.dataset.width;document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));status()}));target.addEventListener('change',()=>{preview.src=target.value;status()});</script></body></html>
