name: Refresh MONOHUNT public article status
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: monohunt-public-status
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public WordPress article data
        run: python scripts/fetch_wp_status.py
      - name: Commit updated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public WordPress status"
            git push
          fi
